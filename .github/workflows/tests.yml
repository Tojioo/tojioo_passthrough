name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"

      - name: Run tests
        run: |
          pytest --cov=python --cov-report=term-missing

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install web dependencies
        working-directory: web
        run: |
          npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: web
        run: |
          npm run typecheck

      - name: Run web tests (Vitest)
        working-directory: web
        run: |
          npm run test:run

      - name: Build bundle
        working-directory: web
        run: |
          npm run build

      - name: Check committed bundle matches the build
        run: |
          if [ -n "$(git status --porcelain -- web/js)" ]; then
            git status --porcelain -- web/js
            git --no-pager diff --stat -- web/js
            echo "web/js/extension.js is stale. Run 'npm run build' in web/ and commit the result."
            exit 1
          fi